name: College ERP CI/CD

on:
  push:
    branches: [main]

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build successful"

      - name: Test
        run: test -f index.html

      - name: Package
        run: zip college-erp-portal.zip index.html

      - name: Deploy
        run: echo "College ERP Portal deployed successfully"